# 当推送 v* 标签时自动构建并发布 Release
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原 NuGet 包
        run: nuget restore Incode.sln

      - name: 编译 Release
        run: msbuild Incode.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: 打包产物
        shell: pwsh
        run: |
          $releaseDir = "IncodeWindow\bin\Release"
          $zipName = "Incode-Release.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          echo "打包完成: $zipName"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: Incode-Release.zip
          generate_release_notes: true
